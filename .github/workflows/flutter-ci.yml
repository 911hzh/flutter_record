name: Flutter CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  flutter-ci:
    name: Flutter checks
    runs-on: macos-15
    defaults:
      run:
        working-directory: flutter_study

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: flutter_study/.fvmrc
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test --no-pub
      - name: Build iOS simulator
        run: flutter build ios --simulator --debug --no-pub

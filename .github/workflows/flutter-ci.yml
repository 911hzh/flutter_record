name: Flutter CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_study

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: flutter_study/.fvmrc
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

  test-and-build:
    name: Flutter checks
    needs: analyze
    runs-on: macos-15
    defaults:
      run:
        working-directory: flutter_study

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: flutter_study/.fvmrc
          cache: true
      - run: flutter pub get
      - run: flutter test --no-pub
      - run: flutter build ios --simulator --debug --no-pub
